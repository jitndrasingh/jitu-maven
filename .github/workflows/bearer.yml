# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# This workflow file requires a free account on Bearer.com to manage findings.
# See https://docs.bearer.com/guides/bearer-cloud/

name: Bearer

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '44 13 * * 3'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  bearer:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Run Bearer security scan
      - name: Run Bearer scan
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc
        with:
          api-key: ${{ secrets.BEARER_TOKEN }}
          format: sarif
          output: results.sarif
          exit-code: 0

      # Normalize SARIF to ensure GitHub accepts it (handles empty scans)
      - name: Normalize SARIF
        run: |
          jq '
            .runs |= map(
              if has("results") and (.results | type == "array")
              then .
              else . + { "results": [] }
              end
            )
          ' results.sarif > fixed.sarif
          mv fixed.sarif results.sarif

      # Upload SARIF results to GitHub Security tab
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
